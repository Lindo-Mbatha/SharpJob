s.","Contribute elements back to the core brand design language."],requirements:["3+ years of experience designing complex web or mobile apps.","Strong portfolio demonstrating user-centered design and micro-interactions.","Expert command of Figma, prototyping tools, and asset delivery.","Deep understanding of responsive grids and cross-platform UI standards."],companyBio:"Airbnb is a global platform that connects hosts with travelers seeking local lodging and experiences. We champion belonging, creativity, and simple, beautiful design."},{id:"job-2",title:"Backend Developer",company:"Stripe",category:"Engineering",location:"Seattle, WA (Hybrid)",type:"Full-time",salary:"R150,000 - R185,000",closes:"Oct 15, 2026",description:"Join our API Foundations team to build ultra-reliable financial routing backend services. You will design, implement, and maintain scalable systems processing millions of transactions daily with millisecond-level latencies.",responsibilities:["Design robust, highly secure RESTful and gRPC web services.","Optimize database queries, distributed caching, and connection handling.","Perform code reviews, draft comprehensive architectural blueprints, and lead feature releases.","Collaborate with risk engineering to enhance fraud detection microservices."],requirements:["4+ years of professional backend software engineering experience.","Proficiency in Ruby, Go, Java, or Node.js in high-throughput environments.","Excellent understanding of SQL databases, ACID transactions, and Redis caching.","Strong advocates for writing elegant, test-driven, self-documenting code."],companyBio:"Stripe is a financial infrastructure platform for the internet. Millions of companies—from the world's largest enterprises to startups—use Stripe to accept payments and manage transactions."},{id:"job-3",title:"Marketing Manager",company:"HubSpot",category:"Marketing",location:"Boston, MA",type:"Full-time",salary:"R95,000 - R120,000",closes:"Nov 05, 2026",description:"HubSpot
