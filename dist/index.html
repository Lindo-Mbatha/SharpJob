 a global platform that connects hosts with travelers seeking local lodging and experiences. We champion belonging, creativity, and simple, beautiful design."},{id:"job-2",title:"Backend Developer",company:"Stripe",category:"Engineering",location:"Seattle, WA (Hybrid)",type:"Full-time",salary:"R150,000 - R185,000",closes:"Oct 15, 2026",description:"Join our API Foundations team to build ultra-reliable financial routing backend services. You will design, implement, and maintain scalable systems processing millions of transactions daily with millisecond-level latencies.",responsibilities:["Design robust, highly secure RESTful and gRPC web services.","Optimize database queries, distributed caching, and connection handling.","Perform code reviews, draft comprehensive architectural blueprints, and lead feature releases.","Collaborate with risk engineering to enhance fraud detection microservices."],requirements:["4+ years of professional backend software engineering experience.","Proficiency in Ruby, Go, Java, or Node.js in high-throughput environments.","Excellent understanding of SQL databases, ACID transactions, and Redis caching.","Strong advocates for writing elegant, test-driven, self-documenting code."],companyBio:"Stripe is a financial infrastructure platform for the internet. Millions of companies—from the world's largest enterprises to startups—use Stripe to accept payments and manage transactions."},{id:"job-3",title:"Marketing Manager",company:"HubSpot",category:"Marketing",location:"Boston, MA",type:"Full-time",salary:"R95,000 - R120,000",closes:"Nov 05, 2026",description:"HubSpot is seeking an inbound marketing master to orchestrate our customer acquisition campaigns. You will analyze target audiences, design cross-channel funnels, and write high-converting copy to expand our growth loop.",responsibilities:["Lead omni-channel acquisition efforts including SEO, social media, and newsletter sponsorships.","Configure and A/B test registration funnels and email nurture sequences.","Analyze campaign KPIs, compiling monthly reports and forecasting user growth.","Partner with product managers to trigger tailored in-app promotions."],requirements:["3+ years in growth marketing or growth product roles in B2B SaaS.","Demonstrated track record of scaling newsletters or paid acquisition channels.","Expertise with analytics suites (Google Analytics, Mixpanel, Amplitude).","Excellent copywriting skills with an eye for clean visual presentation."],companyBio:"HubSpot is a leading customer platform that provides software, service, and support to help businesses grow better. We believe in transparency, high alignment, and inbound-first strategies."},{id:"job-4",title:"Senior Cloud Engineer",company:"Snowflake",category:"Engineering",location:"San Jose, CA",type:"Full-time",salary:"R165,000 - R210,000",closes:"Nov 12, 2026",description:"We are seeking a Senior Cloud Infrastructure Engineer to scale our multi-cloud deployment automation. You will write infrastructure-as-code to manage millions of virtual nodes running in AWS, GCP, and Azure.",responsibilities:["Author robust Terraform modules and Kubernetes manifests for globally distributed applications.","Build self-healing CI/CD pipelines to release core database nodes safely and progressively.","Monitor system health, manage incident response, and lead post-mortems for reliability improvements.","Review network security policies and configure secure identity and access management."],requirements:["5+ years of production experience in high-scale DevOps or Site Reliability Engineering.","Mastery of Docker, Kubernetes, Terraform, and cloud-native network architectures.","Deep expertise in shell scripting or languages like Go and Python.","Comfort with multi-region replication, fault tolerance, and disaster recovery strategies."],companyBio:"Snowflake enables every organization to mobilize their data with the Data Cloud. We help customers solve the most complex data-sharing and analytic
